<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf6ff">
  <title>手机扫码投屏</title>
  <style>
    :root { color-scheme: light; --ink:#173f5f; --muted:#6f8ca3; --blue:#2e79b8; --line:#dcebf8; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; padding:22px 16px 34px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; color:var(--ink); background:radial-gradient(circle at 20% 0,#e3f4ff,transparent 48%),linear-gradient(160deg,#f7fcff,#eef8ff); }
    .card { max-width:520px; margin:0 auto; padding:20px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:18px; box-shadow:0 18px 50px rgba(36,91,133,.12); }
    .eyebrow { color:#3c86bd; font-size:12px; letter-spacing:2px; font-weight:700; }
    h1 { margin:7px 0 6px; font-size:25px; letter-spacing:-.5px; }
    .sub { margin:0 0 18px; color:var(--muted); font-size:13px; line-height:1.7; }
    .status { display:flex; gap:8px; align-items:center; padding:11px 12px; margin-bottom:14px; color:#52738c; font-size:12px; background:#f5fbff; border:1px solid #e3f0fa; border-radius:10px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#e0a33d; box-shadow:0 0 0 4px rgba(224,163,61,.12); flex:0 0 auto; }
    .dot.on { background:#2ca277; box-shadow:0 0 0 4px rgba(44,162,119,.12); }
    .preview { width:100%; aspect-ratio:16/10; object-fit:contain; background:#10202c; border-radius:12px; margin-bottom:14px; }
    .buttons { display:grid; gap:9px; }
    button { width:100%; min-height:47px; border:0; border-radius:10px; font:inherit; font-size:14px; font-weight:700; cursor:pointer; }
    button.primary { color:#fff; background:linear-gradient(135deg,#347fba,#2b6da3); box-shadow:0 7px 16px rgba(46,121,184,.2); }
    button.secondary { color:#2e6e9d; background:#f1f9ff; border:1px solid #d9ebfa; }
    button.stop { color:#a34d4d; background:#fff5f5; border:1px solid #f1dddd; }
    button:disabled { opacity:.45; }
    .note { margin-top:15px; padding-top:13px; border-top:1px solid #edf5fb; color:#8ba1b2; font-size:11px; line-height:1.75; }
    .badge { display:inline-block; padding:3px 7px; margin-bottom:8px; font-size:10px; color:#367fae; background:#edf8ff; border-radius:5px; }
    @media (max-width:380px) { .card { padding:16px; } h1 { font-size:22px; } }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">枣庄八中集成桌面教学系统</span>
    <div class="eyebrow">PHONE CAST</div>
    <h1>手机扫码投屏</h1>
    <p class="sub">手机和电脑连接同一 Wi-Fi，选择摄像头或屏幕共享即可投到教室大屏。</p>
    <div class="status"><span class="dot" id="dot"></span><span id="status">正在连接电脑…</span></div>
    <video class="preview" id="video" autoplay muted playsinline></video>
    <div class="buttons">
      <button type="button" class="primary" id="startCamera" disabled>打开手机摄像头投屏</button>
      <button type="button" class="secondary" id="startScreen" disabled>共享手机屏幕</button>
      <button type="button" class="stop" id="stop" disabled>停止投屏</button>
    </div>
    <p class="note">首次打开如果提示“连接不安全”，请选择“高级 → 继续访问”。摄像头/屏幕共享需要浏览器授权。<br>蓝牙不能传输视频画面，投屏使用同一局域网 Wi-Fi；可在电脑端打开 Windows 蓝牙设置完成手机配对。</p>
  </main>
  <canvas id="canvas" hidden></canvas>
  <script>
    (() => {
      const token = new URLSearchParams(location.search).get('t') || '';
      const statusNode = document.getElementById('status');
      const dot = document.getElementById('dot');
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const startCamera = document.getElementById('startCamera');
      const startScreen = document.getElementById('startScreen');
      const stopButton = document.getElementById('stop');
      let socket = null;
      let stream = null;
      let timer = 0;
      let reconnecting = 0;
      const setStatus = (text, live = false) => {
        statusNode.textContent = text;
        dot.classList.toggle('on', live);
      };
      const connect = () => {
        if (!token) { setStatus('投屏码无效，请重新扫描电脑上的二维码'); return; }
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${protocol}//${location.host}/ws?t=${encodeURIComponent(token)}`);
        socket.addEventListener('open', () => {
          setStatus('已连接，请选择投屏方式', true);
          startCamera.disabled = false;
          startScreen.disabled = false;
          reconnecting = 0;
        });
        socket.addEventListener('close', () => {
          setStatus('电脑连接已断开');
          startCamera.disabled = true;
          startScreen.disabled = true;
          if (reconnecting < 2) {
            reconnecting += 1;
            setTimeout(connect, 1200);
          }
        });
        socket.addEventListener('error', () => setStatus('连接失败，请确认电脑端投屏已开启'));
      };
      const stopStream = () => {
        window.clearInterval(timer);
        timer = 0;
        if (stream) stream.getTracks().forEach((track) => track.stop());
        stream = null;
        video.srcObject = null;
        stopButton.disabled = true;
      };
      const sendFrame = () => {
        if (!stream || !socket || socket.readyState !== WebSocket.OPEN || video.readyState < 2) return;
        const maxWidth = 960;
        const ratio = video.videoWidth && video.videoHeight ? video.videoWidth / video.videoHeight : 16 / 9;
        const width = Math.min(maxWidth, video.videoWidth || maxWidth);
        const height = Math.round(width / ratio);
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        const context = canvas.getContext('2d', { alpha: false });
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        socket.send(canvas.toDataURL('image/jpeg', 0.66));
      };
      const begin = async (mode) => {
        if (!navigator.mediaDevices) { setStatus('此浏览器不支持摄像头/屏幕共享，请使用最新版 Chrome 或 Edge'); return; }
        stopStream();
        try {
          let actualMode = mode;
          let fallbackNote = '';
          if (mode === 'screen') {
            if (navigator.mediaDevices.getDisplayMedia) {
              try {
                stream = await navigator.mediaDevices.getDisplayMedia({
                  video: { frameRate: { ideal: 15, max: 20 } },
                  audio: false
                });
              } catch (screenError) {
                fallbackNote = `当前手机浏览器无法直接共享屏幕（${screenError.name || screenError.message}），已切换为摄像头模式，请将手机对准屏幕。`;
              }
            } else {
              fallbackNote = '当前手机浏览器不支持直接共享屏幕，已切换为摄像头模式，请将手机对准屏幕。';
            }
            if (!stream) {
              actualMode = 'camera';
            }
          }
          if (!stream) {
            stream = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
            });
          }
          video.srcObject = stream;
          await video.play();
          const track = stream.getVideoTracks()[0];
          if (track) track.addEventListener('ended', () => { stopStream(); setStatus('投屏已停止'); });
          timer = window.setInterval(sendFrame, 120);
          startCamera.disabled = true;
          startScreen.disabled = true;
          stopButton.disabled = false;
          setStatus(fallbackNote || (actualMode === 'screen' ? '正在共享手机屏幕' : '正在投屏手机摄像头'), true);
        } catch (error) {
          stopStream();
          setStatus(`无法开始：${error.message}`);
        }
      };
      startCamera.addEventListener('click', () => begin('camera'));
      startScreen.addEventListener('click', () => begin('screen'));
      stopButton.addEventListener('click', () => { stopStream(); setStatus('已停止投屏，可重新选择'); startCamera.disabled = !socket || socket.readyState !== WebSocket.OPEN; startScreen.disabled = startCamera.disabled; });
      connect();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>八中快捷</title>
  <style>
    :root {
      --widget-size: 260px;
      --slot-size: 52px;
      --slot-radius: calc(var(--widget-size) * 0.32);
      --slot-angle: -90deg;
      --slot-counter-angle: 90deg;
      --ink: #244f6d;
      --blue: #347fb5;
      --line: rgba(137, 187, 222, 0.55);
      --glass: rgba(247, 252, 255, 0.94);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body {
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .widget-shell {
      position: absolute;
      inset: 15px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 20%, rgba(255,255,255,.98), rgba(237,249,255,.92) 58%, rgba(222,242,255,.9));
      box-shadow: 0 16px 42px rgba(28, 81, 119, .22), inset 0 0 0 7px rgba(255,255,255,.46);
      -webkit-app-region: drag;
      backdrop-filter: blur(13px);
      animation: widget-in .35s ease-out both;
    }
    .widget-shell::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px dashed rgba(77, 146, 193, .28);
      border-radius: 50%;
      pointer-events: none;
    }
    .widget-center {
      position: absolute;
      left: 50%;
      top: 50%;
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      transform: translate(-50%, -50%);
      overflow: hidden;
      background: #fff;
      border: 3px solid rgba(255,255,255,.96);
      border-radius: 50%;
      box-shadow: 0 6px 18px rgba(32, 90, 129, .18);
      -webkit-app-region: drag;
    }
    .widget-center img { width: 100%; height: 100%; object-fit: cover; }
    .widget-center span {
      position: absolute;
      right: -1px;
      bottom: -1px;
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      background: #2f7fb5;
      border: 2px solid #fff;
      border-radius: 50%;
    }
    .widget-slot {
      position: absolute;
      display: grid;
      place-items: center;
      gap: 3px;
      left: 50%;
      top: 50%;
      width: var(--slot-size);
      height: var(--slot-size);
      padding: 0;
      transform: translate(-50%, -50%) rotate(var(--slot-angle)) translateY(calc(var(--slot-radius) * -1)) rotate(var(--slot-counter-angle));
      color: var(--ink);
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(131, 184, 219, .55);
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(38, 92, 127, .12);
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: transform .16s, box-shadow .16s, background .16s;
    }
    .widget-slot:hover {
      transform: translate(-50%, -50%) rotate(var(--slot-angle)) translateY(calc(var(--slot-radius) * -1)) rotate(var(--slot-counter-angle)) scale(1.08);
      background: #fff;
      box-shadow: 0 7px 17px rgba(38, 92, 127, .2);
    }
    .widget-slot .slot-mark {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      font-weight: 700;
      color: #2f7fb5;
      background: #edf8ff;
      border-radius: 50%;
    }
    .widget-slot .slot-label { font-size: 9px; font-weight: 600; white-space: nowrap; }
    .widget-close {
      position: absolute;
      top: 6px;
      right: 7px;
      z-index: 20;
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      padding: 0;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1;
      color: #7e9bb0;
      background: rgba(255,255,255,.7);
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    .widget-close:hover { color: #b05f5f; background: #fff2f2; }
    .widget-title {
      position: absolute;
      left: 50%;
      top: 13px;
      transform: translateX(-50%);
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #8baabe;
      pointer-events: none;
      white-space: nowrap;
    }
    @keyframes widget-in {
      from { opacity: 0; transform: scale(.88); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="widget-shell">
    <div class="widget-center">
      <img src="../assets/school-badge.png" alt="八中校徽">
      <span>八中</span>
    </div>
    <button type="button" class="widget-slot" data-slot="0"><span class="slot-mark">白</span><span class="slot-label">白板</span></button>
    <button type="button" class="widget-slot" data-slot="1"><span class="slot-mark">展</span><span class="slot-label">展台</span></button>
    <button type="button" class="widget-slot" data-slot="2"><span class="slot-mark">批</span><span class="slot-label">批注</span></button>
    <button type="button" class="widget-slot" data-slot="3" hidden><span class="slot-mark">英</span><span class="slot-label">英语网</span></button>
    <button type="button" class="widget-slot" data-slot="4" hidden><span class="slot-mark">算</span><span class="slot-label">计算器</span></button>
    <button type="button" class="widget-slot" data-slot="5" hidden><span class="slot-mark">时</span><span class="slot-label">计时器</span></button>
    <button type="button" class="widget-slot" data-slot="6" hidden><span class="slot-mark">音</span><span class="slot-label">环境音量</span></button>
    <button type="button" class="widget-slot" data-slot="7" hidden><span class="slot-mark">网</span><span class="slot-label">内置浏览器</span></button>
  </div>
  <button type="button" class="widget-close" id="widgetClose" title="隐藏悬浮快捷键">×</button>
  <script>
    (() => {
      const marks = { whiteboard: '白', camera: '展', annotation: '批', browser: '网', graph: 'ƒ', calculator: '算', politics: '闻', timer: '时', volume: '音', englishexam: '英', students: '点', vote: '票' };
      const shortLabels = { whiteboard: '白板', camera: '展台', annotation: '批注', englishweb: '英语', graph: '函数', calculator: '计算器', volume: '音量', browser: '浏览器', timer: '计时', politics: '时事', englishexam: '往年题', students: '点名', vote: '投票', phone: '投屏', ai: 'AI', wordgame: '单词', vocab: '3500' };
      const slots = Array.from(document.querySelectorAll('.widget-slot'));
      const applyConfig = (config) => {
        const items = config && Array.isArray(config.items) ? config.items : [];
        const size = Math.max(240, Math.min(380, Number(config && config.size) || 260));
        document.documentElement.style.setProperty('--widget-size', `${size}px`);
        const visible = [];
        slots.forEach((slot, index) => {
          const item = items[index];
          slot.hidden = !item;
          if (!item) return;
          slot.dataset.page = item.page;
          slot.querySelector('.slot-mark').textContent = marks[item.page] || (item.label || '·').slice(0, 1);
          slot.querySelector('.slot-label').textContent = shortLabels[item.page] || item.label || item.page;
          slot.title = item.label || item.page;
          visible.push(slot);
        });
        visible.forEach((slot, index) => {
          const count = Math.max(1, visible.length);
          // 3 个以上时整体旋转半个间隔，避免顶部正中的按钮压住标题。
          const offset = count > 2 ? 180 / count : 0;
          const angle = -90 + offset + (360 / count) * index;
          slot.style.setProperty('--slot-angle', `${angle}deg`);
          slot.style.setProperty('--slot-counter-angle', `${-angle}deg`);
        });
      };
      slots.forEach((slot) => {
        slot.addEventListener('click', () => {
          if (slot.dataset.page) window.widgetAPI.openPage(slot.dataset.page);
        });
      });
      document.getElementById('widgetClose').addEventListener('click', () => window.widgetAPI.hide());
      if (window.widgetAPI && window.widgetAPI.onConfig) window.widgetAPI.onConfig(applyConfig);
    })();
  </script>
</body>
</html>

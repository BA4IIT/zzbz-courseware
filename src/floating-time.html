<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>北京时间</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; }
    .float-card {
      position: absolute; inset: 5px; padding: 7px 12px;
      background: linear-gradient(145deg, rgba(250,254,255,.98), rgba(226,245,255,.97));
      border: 1px solid #cfe7f7; border-radius: 14px;
      box-shadow: 0 8px 24px rgba(28, 80, 116, .24);
      -webkit-app-region: drag; cursor: move;
    }
    .float-close {
      position: absolute; top: 5px; right: 6px; z-index: 3; width: 17px; height: 17px;
      padding: 0; color: #7595aa; font-size: 14px; line-height: 1;
      background: rgba(255,255,255,.7); border: 0; border-radius: 50%;
      -webkit-app-region: no-drag; cursor: pointer;
    }
    .float-close:hover { color: #b05f5f; background: #fff0f0; }
    .float-label { position: absolute; left: 11px; top: 5px; font-size: 6px; letter-spacing: 1px; color: #88a7bb; }
    .float-card.is-digital { display: grid; place-items: center; }
    .float-digital { text-align: center; padding-top: 2px; }
    .float-digital strong { display: block; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: calc(var(--size) * .20); line-height: 1; color: #2b678f; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
    .float-digital span { display: block; margin-top: 4px; font-size: calc(var(--size) * .052); color: #8ba6b8; }
    .float-analog { position: absolute; left: 50%; top: 50%; width: calc(var(--size) * .76); height: calc(var(--size) * .76); transform: translate(-50%, -47%); border: 2px solid #cfe5f3; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 6px #f1faff; }
    .float-analog::after { content: ""; position: absolute; inset: 9%; border: 1px dashed #dcecf6; border-radius: 50%; }
    .float-hand { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; border-radius: 5px; }
    .float-hour { width: 5px; height: 28%; margin-left: -2.5px; background: #315a78; }
    .float-minute { width: 3.5px; height: 37%; margin-left: -1.75px; background: #3f87b3; }
    .float-second { width: 1.5px; height: 41%; margin-left: -.75px; background: #d26464; }
    .float-pin { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; transform: translate(-50%,-50%); background: #2f7fb5; border: 2px solid #fff; border-radius: 50%; }
    .float-digital-view[hidden], .float-analog-view[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="float-card" id="floatCard">
    <span class="float-label">BEIJING TIME</span>
    <button type="button" class="float-close" id="floatClose" title="关闭">×</button>
    <div class="float-digital-view" id="floatDigitalView">
      <div class="float-digital"><strong id="floatDigital">--:--:--</strong><span id="floatDate"></span></div>
    </div>
    <div class="float-analog-view" id="floatAnalogView">
      <div class="float-analog">
        <i class="float-hand float-hour" id="floatHour"></i>
        <i class="float-hand float-minute" id="floatMinute"></i>
        <i class="float-hand float-second" id="floatSecond"></i>
        <i class="float-pin"></i>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const style = params.get('style') === 'digital' ? 'digital' : 'clock';
      const size = Math.max(160, Math.min(480, Number(params.get('size')) || 260));
      document.documentElement.style.setProperty('--size', `${size}px`);
      const digitalView = document.getElementById('floatDigitalView');
      const analogView = document.getElementById('floatAnalogView');
      const digital = document.getElementById('floatDigital');
      const dateNode = document.getElementById('floatDate');
      const hourHand = document.getElementById('floatHour');
      const minuteHand = document.getElementById('floatMinute');
      const secondHand = document.getElementById('floatSecond');
      if (style === 'digital') { digitalView.hidden = false; analogView.hidden = true; document.getElementById('floatCard').classList.add('is-digital'); }
      else { digitalView.hidden = true; analogView.hidden = false; }
      const format = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const tick = () => {
        const parts = {};
        format.formatToParts(new Date()).forEach((part) => { parts[part.type] = part.value; });
        const h = Number(parts.hour) % 24, m = Number(parts.minute), s = Number(parts.second);
        const text = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        digital.textContent = text;
        dateNode.textContent = `${parts.year}年${parts.month}月${parts.day}日`;
        hourHand.style.transform = `rotate(${(h % 12) * 30 + m * 0.5}deg)`;
        minuteHand.style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
        secondHand.style.transform = `rotate(${s * 6}deg)`;
      };
      tick();
      setInterval(tick, 1000);
      document.getElementById('floatClose').addEventListener('click', () => window.close());
    })();
  </script>
</body>
</html>
